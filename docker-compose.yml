# Full local stack: Postgres warehouse + FastAPI backend + React UI.
# Airflow is intentionally a separate, optional concern to keep the default stack light.
services:
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: insightforge
      POSTGRES_PASSWORD: insightforge
      POSTGRES_DB: insightforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./warehouse/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      INSIGHTFORGE_WAREHOUSE_DSN: postgresql://insightforge:insightforge@warehouse:5432/insightforge
      INSIGHTFORGE_SECRETS_BACKEND: env
      INSIGHTFORGE_AUTH_DISABLED: "true"
      INSIGHTFORGE_TENANTS_DIR: /config/tenants
    volumes:
      - ./config:/config:ro
    depends_on:
      warehouse:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
